<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kinhold</title>
<meta name="description" content="Kinhold helps a small UK business check its cyber, fraud and AI readiness in about 15 minutes, then follow a plain-English plan. A portfolio prototype by Khadijat Othman.">
<meta name="theme-color" content="#F7F3EE">
<script>
  // Saved theme and sidebar state before first paint. Otherwise follow the system setting.
  (function () { try { var t = localStorage.getItem('kinhold.theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); if (localStorage.getItem('kinhold.side') === 'collapsed') document.documentElement.classList.add('side-collapsed'); } catch (e) {} })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/kinhold.css">
<link rel="icon" type="image/svg+xml" href="img/kinhold-mark.svg">
</head>
<body>
<a class="skip" href="#view">Skip to content</a>
<div class="app">
  <aside class="side" id="side" aria-label="Kinhold navigation">
    <a class="brand" href="#home">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#A6492A"/><path d="M16 6.5l8 3v6c0 5.3-3.4 9.4-8 10.9-4.6-1.5-8-5.6-8-10.9v-6z" fill="#F7E3D6"/><path d="M16 9.2l5.4 2v4.3c0 3.8-2.3 6.7-5.4 7.9z" fill="#E7A27F"/><circle cx="16" cy="15.4" r="2.4" fill="#A6492A"/></svg>
      <span><span class="brand-name">Kinhold</span><span class="brand-sub">Cyber and AI readiness</span></span>
    </a>
    <nav class="nav" id="nav" aria-label="Main"></nav>
    <div class="side-foot">
      <p>Prototype with a fictional brand and sample data.</p>
      <a href="../" title="Back to portfolio"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6l-6 6 6 6"/></svg><span>Back to portfolio</span></a>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menu-btn" type="button" aria-controls="side" aria-expanded="false" aria-label="Open navigation"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <button class="icon-btn side-toggle" id="side-toggle" type="button" aria-controls="side" aria-expanded="true" aria-label="Collapse sidebar"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><path d="M9.5 4.5v15"/></svg></button>
      <button class="back-btn" id="back-btn" type="button" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6l-6 6 6 6"/></svg>Back</button>
      <div class="crumb"><b id="crumb-business">Your business</b><span aria-hidden="true">/</span><span id="crumb-view">Home</span></div>
      <div class="top-right">
        <span class="saved" id="saved" role="status" hidden><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"/></svg><span class="label">Saved on this device</span></span>
        <button class="icon-btn" id="theme-btn" type="button"></button>
      </div>
    </header>
    <main class="view" id="view" tabindex="-1"><p class="muted">Loading…</p></main>
  </div>
</div>
<div class="scrim" id="scrim" hidden></div>
<noscript><p style="padding:16px">Kinhold needs JavaScript to run the readiness check in your browser.</p></noscript>
<script src="js/engine/scoring.js"></script>
<script src="js/engine/recommend.js"></script>
<script src="js/engine/checker.js"></script>
<script src="js/illustrations.js"></script>
<script src="js/app.js"></script>
<script src="js/views/home.js"></script>
<script src="js/views/check.js"></script>
<script src="js/views/results.js"></script>
<script src="js/views/plan.js"></script>
<script src="js/views/checker.js"></script>
<script>KinholdApp.start();</script>
</body>
</html>
