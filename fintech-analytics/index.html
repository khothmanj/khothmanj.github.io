<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Signal · Product analytics for a lending API</title>
<meta name="description" content="Signal is a product analytics workspace for Lendwell, a fictional lending API company. Every chart runs real SQL in your browser. A portfolio prototype by Khadijat Othman.">
<meta name="theme-color" content="#F6F5F1">
<script>
  // Apply a saved theme before first paint. Otherwise follow the system setting.
  (function () { try { var t = localStorage.getItem('signal.theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {} })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/signal.css">
<link rel="icon" type="image/svg+xml" href="img/signal-mark.svg">
</head>
<body>
<a class="skip" href="#view">Skip to content</a>
<div class="app">
  <aside class="side" id="side" aria-label="Signal navigation">
    <a class="brand" href="#overview">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#0D5C63"/><path d="M6 18.5h4.2l2.6-7.5 4.4 12 2.9-8.3 1.6 3.8H26" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span><span class="brand-name">Signal</span><span class="brand-sub">Product analytics</span></span>
    </a>
    <nav class="nav" id="nav" aria-label="Views"></nav>
    <div class="side-foot">
      <p>Prototype with a fictional brand and sample data.</p>
      <a href="../">Back to portfolio</a>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menu-btn" type="button" aria-controls="side" aria-expanded="false" aria-label="Open navigation"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="workspace">
        <span class="ws-avatar" aria-hidden="true">L</span>
        <span class="ws-name">Lendwell</span>
        <span class="ws-sep" aria-hidden="true">/</span>
        <span class="ws-view" id="ws-view">Product analytics</span>
      </div>
      <div class="top-right">
        <span class="refreshed" id="refreshed" role="status"><span class="dot loading" aria-hidden="true"></span><span class="label">Loading database</span></span>
        <div class="range" id="range"></div>
        <button class="icon-btn" id="theme-btn" type="button"></button>
      </div>
    </header>
    <main class="view" id="view" tabindex="-1"></main>
  </div>
</div>
<div class="scrim" id="scrim" hidden></div>
<noscript><p style="padding:16px">Signal runs a SQLite database in your browser, so it needs JavaScript.</p></noscript>
<script src="js/queries.js"></script>
<script src="js/db.js"></script>
<script src="js/sqlui.js"></script>
<script src="js/kit.js"></script>
<script src="js/charts.js"></script>
<script src="js/app.js"></script>
<script src="js/views/sql.js"></script>
<script src="js/views/overview.js"></script>
<script src="js/views/activation.js"></script>
<script src="js/views/accounts.js"></script>
<script src="js/views/customer.js"></script>
<script src="js/views/usage.js"></script>
<script src="js/views/health.js"></script>
<script src="js/views/integrity.js"></script>
<script>SignalApp.start();</script>
</body>
</html>
